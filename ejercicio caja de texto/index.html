<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Palíndromo</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
}

input {
    padding: 10px;
    width: 250px;
}

#resultado {
    margin-top: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<h2>Verificador de Palíndromos</h2>

<input type="text" id="texto" placeholder="Escribe aquí">

<div id="resultado"></div>

<script>
const input = document.getElementById("texto");
const resultado = document.getElementById("resultado");

// Evento clave: KEYUP (correcto)
input.addEventListener("keyup", function(event) {

    let palabra = input.value.toLowerCase().replace(/\s/g, "");
    let invertida = palabra.split("").reverse().join("");

    if (palabra === "") {
        resultado.innerHTML = "";
        return;
    }

    if (palabra === invertida) {
        resultado.innerHTML = "✅ Es palíndromo";
    } else {
        resultado.innerHTML = "❌ No es palíndromo";
    }

    // SOLO alerta cuando presiona ENTER
    if (event.key === "Enter" && palabra === invertida) {
        alert("Es palíndromo");
    }
});
</script>

</body>
</html>
