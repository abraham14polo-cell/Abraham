<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Inmobiliaria</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8;}
header{background:#1f2a44;color:white;padding:15px;}
.container{display:flex;}
menu{width:220px;background:#26344f;min-height:100vh;}
menu button{width:100%;padding:15px;border:none;background:none;color:white;text-align:left;cursor:pointer;}
menu button:hover{background:#1f2a44;}
main{flex:1;padding:20px;}
table{width:100%;background:white;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ddd;}
input,select{padding:8px;margin:5px;}
button.action{padding:5px 10px;}
</style>
</head>

<body>

<header>Sistema Inmobiliaria</header>

<div class="container">

<menu>
<button onclick="vista('tipos')">Tipo Persona</button>
<button onclick="vista('personas')">Persona</button>
<button onclick="vista('empleados')">Empleado</button>
<button onclick="vista('clientes')">Cliente</button>
<button onclick="vista('propietarios')">Propietario</button>
</menu>

<main id="contenido"></main>

</div>

<script>

const API="/api";
let editId=null;

function vista(tabla){
editId=null;

contenido.innerHTML=`
<h2>${tabla.toUpperCase()}</h2>

<input id="buscar" placeholder="Buscar">
<button onclick="cargar('${tabla}')">Buscar</button>

<br>

<div id="form"></div>

<br>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaDatos"></tbody>
</table>
`;

if(tabla==="tipos"){
form.innerHTML=`
<input id="descripcion" placeholder="Descripción">
<button onclick="guardar('${tabla}')">Guardar</button>
`;
}else{
form.innerHTML=`
<input id="nombre" placeholder="Nombre">
<input id="apellido" placeholder="Apellido">
<select id="tipo"></select>
<button onclick="guardar('${tabla}')">Guardar</button>
`;
cargarTipos();
}

cargar(tabla);
}

function cargar(tabla){
let b=document.getElementById("buscar")?.value || "";

fetch(API+"/"+tabla+"?buscar="+b,{credentials:"include"})
.then(r=>r.json())
.then(data=>{
let html="";

data.forEach(x=>{
let id = x.idTipoPersona || x.idPersona;

html+=`
<tr>
<td>${id}</td>
<td>${x.descripcion || (x.nombre+" "+x.apellido)}</td>
<td>
<button onclick='editar(${JSON.stringify(x)},"${tabla}")'>Editar</button>
<button onclick='eliminar(${JSON.stringify(x)},"${tabla}")'>Eliminar</button>
</td>
</tr>
`;
});

tablaDatos.innerHTML=html;
});
}

function guardar(tabla){

if(tabla==="tipos"){

    let data={descripcion:descripcion.value};

    if(editId){
        fetch(API+"/"+tabla+"/"+editId,{
        method:"PUT",
        credentials:"include",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
        }).then(()=>{editId=null;vista(tabla);});
    }else{
        fetch(API+"/"+tabla,{
        method:"POST",
        credentials:"include",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
        }).then(()=>vista(tabla));
    }

}else if(tabla==="personas"){

    let data={
        nombre:nombre.value,
        apellido:apellido.value,
        idTipoPersona:tipo.value
    };

    if(editId){
        fetch(API+"/"+tabla+"/"+editId,{
        method:"PUT",
        credentials:"include",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
        }).then(()=>{editId=null;vista(tabla);});
    }else{
        fetch(API+"/"+tabla,{
        method:"POST",
        credentials:"include",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
        }).then(()=>vista(tabla));
    }
}else{

    // 🔥 CLIENTE / EMPLEADO / PROPIETARIO

    if(editId){

        // 👉 EDITAR (actualiza PERSONA)
        fetch(API+"/personas/"+editId,{
            method:"PUT",
            credentials:"include",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                nombre:nombre.value,
                apellido:apellido.value,
                idTipoPersona:tipo.value
            })
        }).then(()=>{
            editId=null;
            vista(tabla);
        });

    }else{

        // 👉 CREAR

        // 1. crear persona
        fetch(API+"/personas",{
            method:"POST",
            credentials:"include",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                nombre:nombre.value,
                apellido:apellido.value,
                idTipoPersona:tipo.value
            })
        })
        .then(r=>r.json())
        .then(d=>{

            // 2. crear cliente/empleado/etc
            fetch(API+"/"+tabla,{
                method:"POST",
                credentials:"include",
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    idPersona: d.idPersona
                })
            }).then(()=>vista(tabla));

        });

    }


    }
    }


function editar(obj,tabla){

if(tabla==="tipos"){
    editId = obj.idTipoPersona;
    descripcion.value = obj.descripcion;
    return;
}

if(tabla==="personas"){
    editId = obj.idPersona;
    nombre.value = obj.nombre;
    apellido.value = obj.apellido;
    setTimeout(()=>{tipo.value=obj.idTipoPersona},200);
    return;
}

// 🔥 cliente / empleado / propietario
editId = obj.idPersona; // 👈 IMPORTANTE (no el idCliente)
nombre.value = obj.nombre;
apellido.value = obj.apellido;
setTimeout(()=>{tipo.value=obj.idTipoPersona},200);

}

function eliminar(obj,tabla){

let id;

if(tabla==="tipos") id = obj.idTipoPersona;
else if(tabla==="personas") id = obj.idPersona;
else if(tabla==="clientes") id = obj.idCliente;
else if(tabla==="empleados") id = obj.idEmpleado;
else if(tabla==="propietarios") id = obj.idPropietario;

if(confirm("Eliminar?")){
fetch(API+"/"+tabla+"/"+id,{
method:"DELETE",
credentials:"include"
}).then(()=>cargar(tabla));
}
}

function cargarTipos(){
fetch(API+"/tipos",{credentials:"include"})
.then(r=>r.json())
.then(data=>{
tipo.innerHTML=data.map(t=>`<option value="${t.idTipoPersona}">${t.descripcion}</option>`).join("");
});
}

</script>

</body>
</html>
