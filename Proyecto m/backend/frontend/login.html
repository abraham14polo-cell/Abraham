<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}
.card{
background:#1e293b;
padding:30px;
border-radius:10px;
color:white;
width:300px;
}
input,button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}
button{background:#2563eb;color:white;}
</style>
</head>
<body>

<div class="card">
<h2>Login</h2>
<input id="usuario" placeholder="Usuario">
<input id="clave" type="password" placeholder="Clave">
<button onclick="login()">Entrar</button>
<p id="error"></p>
</div>

<script>
function login(){
fetch('/api/auth/login',{
method:'POST',
credentials:'include',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
usuario:usuario.value,
clave:clave.value
})
})
.then(r=>r.json())
.then(d=>{
if(d.ok) location="index.html";
else error.innerText="Error login";
});
}
</script>

</body>
</html>
