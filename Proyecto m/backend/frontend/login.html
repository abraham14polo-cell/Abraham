<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    font-family:Arial;
}

.card{
    background:white;
    width:350px;
    padding:30px;
    border-radius:10px;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    border:none;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

#error{
    color:red;
    text-align:center;
}

.volver{
    background:#475569;
    color:white;
    margin-bottom:20px;
}

</style>

</head>
<body>

<div class="card">

<h2>LOGIN</h2>

<input id="usuario" placeholder="Usuario">

<input
id="clave"
type="password"
placeholder="Clave">

<button onclick="login()">
Ingresar
</button>

<p id="error"></p>

</div>

<script>

function login(){

fetch('/api/auth/login',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

credentials:'include',

body:JSON.stringify({

usuario:usuario.value,
clave:clave.value

})

})

.then(r=>r.json())

.then(data=>{

if(data.ok){

location='menu.html';

}else{

error.innerHTML='Usuario o clave incorrecta';

}

});

}

</script>

</body>
</html>
