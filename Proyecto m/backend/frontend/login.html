<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Inmobiliaria</title>

<style>
body{
    margin:0;
    font-family: "Segoe UI", Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    color:white;
}
input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:none;
    border-radius:6px;
    background:#334155;
    color:white;
}
button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
button:hover{background:#1d4ed8;}
.error{color:#f87171;text-align:center;}
</style>
</head>

<body>

<div class="card">
<h2>Iniciar Sesión</h2>

<input id="usuario" placeholder="Usuario">
<input id="clave" type="password" placeholder="Contraseña">

<button onclick="login()">Entrar</button>

<div id="error" class="error"></div>
</div>

<script>
function login(){
fetch('/api/auth/login',{
method:'POST',
credentials:'include',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
usuario:usuario.value,
clave:clave.value
})
})
.then(r=>r.json())
.then(d=>{
if(d.ok){
window.location="index.html";
}else{
error.innerText="Credenciales incorrectas";
}
});
}
</script>

</body>
</html>
